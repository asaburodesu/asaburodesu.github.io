<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>asaburodesu.github.io</title>
    <meta name="description" content="CHUNITHM・オンゲキ・maimai・アイドルマスター ツアーズ・太鼓の達人・ポラリスコードの設置店舗と、GiGOのお店を探せる地図の一覧です。">
    <link rel="canonical" href="https://asaburodesu.github.io/">
    <link rel="icon" type="image/jpeg" href="assets/avatar.jpg">
    <style>
      :root {
        --bg: #ffffff;
        --text: #222222;
        --muted: #6b6b6b;
        --rule: #e4e4e4;
        --link: #1a5fb4;
      }

      *,
      *::before,
      *::after { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
        font-size: 1rem;
        line-height: 1.8;
        word-break: auto-phrase;
      }

      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 3.5rem 1rem 4rem;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.4;
      }

      h2 {
        margin: 2.5rem 0 .5rem;
        font-size: 1rem;
      }

      p { margin: .75rem 0 0; }

      a { color: var(--link); }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }

      .maps {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--rule);
      }

      .maps li {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        column-gap: 1rem;
        padding: .625rem 0;
        border-bottom: 1px solid var(--rule);
      }

      .maps a {
        font-size: 1.0625rem;
        text-decoration: none;
      }

      .maps a:hover { text-decoration: underline; }

      .since {
        color: var(--muted);
        font-size: .8125rem;
      }

      .links a + a { margin-left: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>設置店舗マップ</h1>
      <p>音ゲーが置いてあるゲームセンターを地図で探せます。各メーカー公式の店舗検索から、毎朝自動で更新しています。</p>

      <h2>地図一覧</h2>
      <ul class="maps">
        <li><a href="https://asaburodesu.github.io/chu_map/">CHUNITHM</a><span class="since">2023年10月〜</span></li>
        <li><a href="https://asaburodesu.github.io/geki_map/">オンゲキ</a><span class="since">2023年12月〜</span></li>
        <li><a href="https://asaburodesu.github.io/mai_map/">maimai</a><span class="since">2023年12月〜</span></li>
        <li><a href="https://asaburodesu.github.io/imas_map/">アイドルマスター ツアーズ</a><span class="since">2025年5月〜</span></li>
        <li><a href="https://asaburodesu.github.io/taiko_map/">太鼓の達人</a><span class="since">2026年2月〜</span></li>
        <li><a href="https://asaburodesu.github.io/gigo_map/">GiGO</a><span class="since">2026年2月〜</span></li>
        <li><a href="https://asaburodesu.github.io/plrs_map/">ポラリスコード</a><span class="since">2026年2月〜</span></li>
      </ul>

      <h2>作った人</h2>
      <p>あさぶろ（<a href="https://about.asaburo.net/">about.asaburo.net</a>）</p>
      <p class="links">
        <a href="https://x.com/asaburodesu">X</a>
        <a href="https://note.com/asaburodesu">note</a>
        <a href="https://github.com/asaburodesu">GitHub</a>
      </p>
    </main>
  </body>
</html>
